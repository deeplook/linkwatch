[project]
name = "linkwatch"
version = "0.2.0"
description = "Monitor internet connectivity and log outages to CSV"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Dinu Gherman", email = "gherman@darwin.in-berlin.de" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.3",
]

[project.scripts]
linkwatch = "linkwatch:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.build-backend]
source-include = ["tests/**", "LICENSE"]
